packages:
  - packages/*

# pnpm 10+ 将该设置从 .npmrc 迁移至此：允许依赖声明用精确版本时自动链接 workspace 包
# （@vendure/* 插件均为私有包，registry 上不存在，必须走 workspace 链接）
linkWorkspacePackages: true

# 把所有已安装依赖提升到根 node_modules（dev-config 顶层 require 的 @nestjs/* 等历史依赖
# 未在 dev-server 显式声明，靠提升解析；过滤安装后布局与历史 hybrid 布局兼容）
shamefullyHoist: true

allowBuilds:
  '@swc/core': true
  esbuild: true
  husky: true
  nx: true
